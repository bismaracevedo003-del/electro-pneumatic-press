  <rect x="30" y="65" width="520" height="300" rx="10" fill="#111c2e" stroke="#243650"/>
  <text x="55" y="105" fill="#06d6a0" font-family="Segoe UI" font-size="28" font-weight="bold">PRESSING</text>
  <g font-family="Segoe UI" font-size="13" fill="#b9c9df"><text x="55" y="140">NO FAULT</text><text x="55" y="180">Clamp Y1</text><text x="55" y="235">Press Y2</text></g>
  <rect x="160" y="170" width="330" height="14" rx="7" fill="#0b1220"/><rect x="160" y="170" width="330" height="14" rx="7" fill="#4cc9f0"/>
  <rect x="160" y="225" width="330" height="14" rx="7" fill="#0b1220"/><rect x="160" y="225" width="190" height="14" rx="7" fill="#4cc9f0"/>
  <g font-family="Segoe UI" font-size="13" fill="#e6edf7"><text x="55" y="290">Cycle count: 12</text><text x="250" y="290">Pressure: 6.5 bar</text><text x="55" y="325">Valves: Y1 Y2</text></g>
  <rect x="580" y="65" width="290" height="300" rx="10" fill="#111c2e" stroke="#243650"/>
  <text x="605" y="100" fill="#e6edf7" font-family="Segoe UI" font-size="17" font-weight="bold">Two-hand station</text>
  <rect x="605" y="125" width="110" height="70" rx="8" fill="#06d6a0"/><text x="625" y="166" fill="#04231b" font-family="Segoe UI" font-size="14" font-weight="bold">BUTTON 1</text>
  <rect x="735" y="125" width="110" height="70" rx="8" fill="#06d6a0"/><text x="755" y="166" fill="#04231b" font-family="Segoe UI" font-size="14" font-weight="bold">BUTTON 2</text>
  <text x="605" y="225" fill="#91a7c4" font-family="Segoe UI" font-size="12">Hold both 0.5 s · release before next cycle</text>
